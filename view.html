<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibi Fatima Shadi Bureau - رشتے دیکھیں</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f5f5; padding: 20px; direction: rtl; text-align: right; }
        .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #d81b60; text-align: center; margin-bottom: 20px; }
        
        /* لاگ ان باکس */
        .login-box { text-align: center; padding: 40px 20px; }
        .google-btn { background-color: #4285F4; color: white; padding: 12px 24px; border: none; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .google-btn:hover { background-color: #357ae8; }
        
        /* رشتوں کے کارڈز */
        .proposal-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-right: 5px solid #d81b60; }
        .proposal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; font-size: 14px; }
        .label { font-weight: bold; color: #555; }
        .whatsapp-btn { display: inline-block; background-color: #25D366; color: white; text-decoration: none; padding: 6px 12px; border-radius: 5px; font-weight: bold; font-size: 13px; margin-top: 10px; }
        
        #proposalsSection { display: none; }
        .user-info { display: flex; justify-content: space-between; align-items: center; background: #fce4ec; padding: 10px 15px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
        .logout-link { color: red; cursor: pointer; text-decoration: underline; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>

<div class="container">
    <h2>💍 بی بی فاطمہ شادی بیورو - رشتے دیکھیں / See Proposals</h2>

    <div id="loginSection" class="login-box">
        <p>رشتے دیکھنے کے لیے پہلے اپنے گوگل اکاؤنٹ سے سائن ان کریں:</p>
        <p style="font-size:13px; color:#666;">Please sign in with your Google account to view proposals:</p>
        <button class="google-btn" onclick="loginWithGoogle()">
            <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/24px.svg" alt="Google">
            Google کے ساتھ سائن ان کریں
        </button>
    </div>

    <div id="proposalsSection">
        <div class="user-info">
            <div>خوش آمدید، <b id="userName">---</b>!</div>
            <div class="logout-link" onclick="logout()">لاگ آؤٹ (Logout)</div>
        </div>

        <h3 id="targetHeading" style="color: #333; margin-bottom: 15px;">آپ کے لیے موزوں رشتے:</h3>
        
        <div id="cardsContainer">
            <p>رشتے لوڈ ہو رہے ہیں...</p>
        </div>
    </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC8py3oEQFtzWIT_K0nIMK5oHoQYG6-zig",
  authDomain: "milk-order-48d48.firebaseapp.com",
  databaseURL: "https://milk-order-48d48-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "milk-order-48d48",
  storageBucket: "milk-order-48d48.firebasestorage.app",
  messagingSenderId: "171586337857",
  appId: "1:171586337857:web:4e16c73f163089460e9ac0",
  measurementId: "G-KEVF788FZ0"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();
const auth = firebase.auth();

// گوگل لاگ ان کا فنکشن
function loginWithGoogle() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider)
    .catch((error) => {
        alert("لاگ ان نہیں ہو سکا: " + error.message);
    });
}

// لاگ آؤٹ کا فنکشن
function logout() {
    auth.signOut();
}

// چیک کریں کہ کسٹمر لاگ ان ہے یا نہیں
auth.onAuthStateChanged((user) => {
    if (user) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('proposalsSection').style.display = 'block';
        document.getElementById('userName').innerText = user.displayName;
        
        loadFilteredProposals();
    } else {
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('proposalsSection').style.display = 'none';
    }
});

// رشتوں کو جنس کے حساب سے فلٹر کر کے لوڈ کرنے کا فنکشن
function loadFilteredProposals() {
    // فارم سے سیو کی گئی جنس حاصل کریں
    const userGender = localStorage.getItem('userGender');
    
    // اگر فارم نہیں بھرا ڈائریکٹ لنک کھولا تو ڈیفالٹ سیٹ کریں
    let targetGender = "Female (لڑکی)"; 
    if(userGender && userGender.includes("Female")) {
        targetGender = "Male (لڑکا)"; // اگر لاگ ان والی لڑکی ہے تو لڑکے دکھائیں
    } else if(userGender && userGender.includes("Male")) {
        targetGender = "Female (لڑکی)"; // اگر لاگ ان والا لڑکا ہے تو لڑکیاں دکھائیں
    }

    document.getElementById('targetHeading').innerText = `📋 دستیاب رشتے: ${targetGender === 'Male (لڑکا)' ? 'لڑکے (Males)' : 'لڑکیاں (Females)'}`;

    database.ref('proposals').on('value', (snapshot) => {
        const container = document.getElementById('cardsContainer');
        container.innerHTML = '';

        if (!snapshot.exists()) {
            container.innerHTML = '<p>فی الحال کوئی رشتہ موجود نہیں ہے۔</p>';
            return;
        }

        const data = snapshot.val();
        let hasData = false;

        Object.keys(data).reverse().forEach((id) => {
            const item = data[id];
            
            // صرف وہ رشتے دکھائیں جو اپوزٹ جینڈر (مخالف جنس) کے ہوں
            if(item.gender === targetGender) {
                hasData = true;
                const card = `
                    <div class="proposal-card">
                        <h4 style="margin:0 0 10px 0; color:#d81b60;">رشتہ کوڈ: #CONF-${id.substring(1,5).toUpperCase()}</h4>
                        <div class="proposal-grid">
                            <div><span class="label">عمر:</span> ${item.age} سال</div>
                            <div><span class="label">ذات:</span> ${item.caste}</div>
                            <div><span class="label">تعلیم و نوکری:</span> ${item.education}</div>
                            <div><span class="label">شہر/پتہ:</span> ${item.location}</div>
                        </div>
                        <div style="margin-top:10px;">
                            <span class="label">ڈیمانڈ/ضروریات:</span> <span style="font-size:13px; color:#444;">${item.requirements}</span>
                        </div>
                        <a class="whatsapp-btn" href="https://wa.me/923076385077?text=سلام، مجھے اس رشتہ کوڈ میں دلچسپی ہے: #CONF-${id.substring(1,5).toUpperCase()}" target="_blank">💬 ایڈمن سے رابطہ کریں</a>
                    </div>
                `;
                container.innerHTML += card;
            }
        });

        if(!hasData) {
            container.innerHTML = `<p>معذرت، اس وقت کوئی ${targetGender === 'Male (لڑکا)' ? 'لڑکا' : 'لڑکی'} کا رشتہ دستیاب نہیں ہے۔</p>`;
        }
    });
}
</script>
</body>
</html>
