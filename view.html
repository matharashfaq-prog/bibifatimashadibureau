<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibi Fatima Shadi Bureau - رشتے دیکھیں</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fce4ec; text-align: right; padding: 20px; direction: rtl; }
        .container { background-color: #ffffff; max-width: 600px; margin: 20px auto; padding: 30px; border-radius: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); border-top: 5px solid #d81b60; }
        h2 { text-align: center; color: #d81b60; }
        .login-box { text-align: center; padding: 30px 10px; }
        .verify-btn { background-color: #d81b60; color: white; padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; }
        .verify-btn:hover { background-color: #ad1457; }
        .proposal-card { background: #fff; border: 1px solid #e0e0e0; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .proposal-card h3 { margin-top: 0; color: #d81b60; font-size: 18px; }
        .proposal-card p { margin: 6px 0; color: #444; font-size: 14px; }
        .gender-tag { display: inline-block; background: #f1f1f1; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 12px; border: 2px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 18px; text-align: center; letter-spacing: 2px; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="container">
    <h2>بی بی فاطمہ شادی بیورو - رشتے</h2>

    <div id="lockSection" class="login-box">
        <p style="font-size: 16px; color: #555; margin-bottom: 20px;">رشتے دیکھنے کے لیے ایڈمن کا دیا ہوا رجسٹریشن نمبر درج کریں:</p>
        <input type="text" id="regInput" placeholder="مثال: FB-12345">
        <button class="verify-btn" onclick="verifyRegistrationNumber()">نمبر تصدیق کریں اور رشتے دیکھیں</button>
    </div>

    <div id="proposalsSection" style="display: none;">
        <h3 style="color: #2e7d32; border-bottom: 2px solid #fce4ec; padding-bottom: 10px;">✅ آپ کا رجسٹریشن نمبر درست ہے!</h3>
        <div id="proposalsList">
            <p style="text-align: center; color: #888;">رشتے لوڈ ہو رہے ہیں...</p>
        </div>
    </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC8py3oEQFtzWIT_K0nIMK5oHoQYG6-zig",
  authDomain: "milk-order-48d48.firebaseapp.com",
  databaseURL: "https://milk-order-48d48-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "milk-order-48d48",
  storageBucket: "milk-order-48d48.firebasestorage.app",
  messagingSenderId: "171586337857",
  appId: "1:171586337857:web:4e16c73f163089460e9ac0"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

// 🔑 نمبر چیک کرنے کا فنکشن
function verifyRegistrationNumber() {
    const inputCode = document.getElementById('regInput').value.trim().toUpperCase();
    
    if(!inputCode) {
        alert("⚠️ براہ کرم رجسٹریشن نمبر درج کریں!");
        return;
    }

    // فائر بیس میں چیک کریں کہ کیا یہ نمبر کسی کسٹمر کا ہے؟
    database.ref('proposals').orderByChild('reg_no').equalTo(inputCode).once('value')
    .then((snapshot) => {
        if (snapshot.exists()) {
            // اگر نمبر میچ ہو گیا تو لاک کھول دیں
            document.getElementById('lockSection').style.display = 'none';
            document.getElementById('proposalsSection').style.display = 'block';
            
            // رشتے لوڈ کریں
            loadProposalsData();
        } else {
            // اگر نمبر غلط ہوا
            alert("❌ غلط رجسٹریشن نمبر! براہ کرم درست نمبر درج کریں یا ایڈمن سے رابطہ کریں۔");
        }
    })
    .catch((error) => {
        alert("ایرر: " + error.message);
    });
}

function loadProposalsData() {
    const userGender = localStorage.getItem('userGender');
    const listDiv = document.getElementById('proposalsList');
    
    database.ref('proposals').on('value', (snapshot) => {
        listDiv.innerHTML = "";
        
        if (!snapshot.exists()) {
            listDiv.innerHTML = "<p style='text-align:center; color:#888;'>ابھی کوئی رشتہ موجود نہیں ہے۔</p>";
            return;
        }

        let hasData = false;

        snapshot.forEach((childSnapshot) => {
            const proposal = childSnapshot.val();
            
            // اپوزٹ جینڈر فلٹر
            let showThis = false;
            if (userGender === "Male (لڑکا)" && proposal.gender === "Female (لڑکی)") showThis = true;
            if (userGender === "Female (لڑکی)" && proposal.gender === "Male (لڑکا)") showThis = true;
            if (!userGender) showThis = true;

            if (showThis) {
                hasData = true;
                const card = `
                    <div class="proposal-card">
                        <h3>رشتہ کوڈ: ${childSnapshot.key.substring(1, 6).toUpperCase()}</h3>
                        <p><strong>عمر:</strong> ${proposal.age} سال</p>
                        <p><strong>ذات/برادری:</strong> ${proposal.caste}</p>
                        <p><strong>تعلیم و ملازمت:</strong> ${proposal.education}</p>
                        <p><strong>شہر:</strong> ${proposal.location}</p>
                        <p><strong>ڈیمانڈ/ضروریات:</strong> ${proposal.requirements}</p>
                        <span class="gender-tag">${proposal.gender}</span>
                    </div>
                `;
                listDiv.innerHTML += card;
            }
        });

        if (!hasData) {
            listDiv.innerHTML = "<p style='text-align:center; color:#888;'>آپ کے لیے مطلوبہ رشتے ابھی موجود نہیں ہیں۔</p>";
        }
    });
}
</script>
</body>
</html>
