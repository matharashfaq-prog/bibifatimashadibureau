<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دودھ آرڈر مینجمنٹ - ایڈمن ڈیش بورڈ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            padding: 20px;
            direction: rtl;
            text-align: right;
        }
        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 { color: #333; border-bottom: 2px solid #25D366; padding-bottom: 10px; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }
        th { background-color: #25D366; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .status-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .pending { background-color: #ffc107; color: black; }
        .delivered { background-color: #28a745; color: white; }
        .whatsapp-link {
            color: #128C7E;
            text-decoration: none;
            font-weight: bold;
        }
    </style>

    <!-- فائر بیس کی لائبریریز -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="container">
    <h2>📥 موصول شدہ آرڈرز (لائیو ڈیش بورڈ)</h2>
    
    <table id="ordersTable">
        <thead>
            <tr>
                <th>تاریخ اور وقت</th>
                <th>گاہک کا نام</th>
                <th>فون نمبر</th>
                <th>لوکیشن (پتہ)</th>
                <th>مقدار (کلو)</th>
                <th>اسٹیٹس</th>
                <th>ایکشن</th>
            </tr>
        </thead>
        <tbody id="ordersBody">
            <tr>
                <td colspan="7">آرڈرز لوڈ ہو رہے ہیں...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
// آپ کے فائر بیس پروجیکٹ کی سیٹنگز
const firebaseConfig = {
  apiKey: "AIzaSyC8py3oEQFtzWIT_K0nIMK5oHoQYG6-zig",
  authDomain: "milk-order-48d48.firebaseapp.com",
  databaseURL: "https://milk-order-48d48-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "milk-order-48d48",
  storageBucket: "milk-order-48d48.firebasestorage.app",
  messagingSenderId: "171586337857",
  appId: "1:171586337857:web:4e16c73f163089460e9ac0",
  measurementId: "G-KEVF788FZ0"
};

// فائر بیس شروع کریں
firebase.initializeApp(firebaseConfig);
const database = firebase.database();

// فائر بیس سے لائیو ڈیٹا حاصل کریں
database.ref('orders').on('value', (snapshot) => {
    const ordersBody = document.getElementById('ordersBody');
    ordersBody.innerHTML = ''; // پرانا ڈیٹا صاف کریں

    if (!snapshot.exists()) {
        ordersBody.innerHTML = '<tr><td colspan="7">کوئی آرڈر موجود نہیں ہے۔</td></tr>';
        return;
    }

    const data = snapshot.val();
    
    // آرڈرز کو الٹا ترتیب دیں تاکہ نیا آرڈر سب سے اوپر آئے
    const orderIds = Object.keys(data).reverse();

    orderIds.forEach((id) => {
        const order = data[id];
        
        // اسٹیٹس کے حساب سے کلاس کا انتخاب کریں
        const statusClass = order.status === 'Pending' ? 'pending' : 'delivered';
        const statusText = order.status === 'Pending' ? 'باقی ہے (Pending)' : 'پہنچ گیا (Delivered)';

        const row = `
            <tr>
                <td>${order.ordered_at || '---'}</td>
                <td><b>${order.customer_name}</b></td>
                <td><a class="whatsapp-link" href="https://wa.me/${order.customer_phone.replace(/[^0-9]/g, '')}" target="_blank">💬 ${order.customer_phone}</a></td>
                <td>${order.customer_location}</td>
                <td><span style="color:blue; font-weight:bold;">${order.milk_quantity} کلو</span></td>
                <td><span class="status-btn ${statusClass}">${statusText}</span></td>
                <td>
                    ${order.status === 'Pending' ? 
                    `<button onclick="markAsDelivered('${id}')" style="background:#28a745; color:white; border:none; padding:5px 10px; border-radius:3px; cursor:pointer;">Delivered کریں</button>` : 
                    `<span style="color:green;">✓ مکمل</span>`}
                </td>
            </tr>
        `;
        ordersBody.innerHTML += row;
    });
});

// آرڈر کو ڈیلیورڈ مارک کرنے کا فنکشن
function markAsDelivered(orderId) {
    if(confirm("کیا آپ اس آرڈر کو 'ڈیلیورڈ' مارک کرنا چاہتے ہیں؟")) {
        database.ref('orders/' + orderId).update({
            status: "Delivered"
        });
    }
}
</script>

</body>
</html>
