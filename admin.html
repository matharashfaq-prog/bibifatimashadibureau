<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibi Fatima Shadi Bureau - ایڈمن ڈیش بورڈ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
            direction: rtl;
            text-align: right;
        }
        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 { color: #d81b60; border-bottom: 3px solid #d81b60; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #d81b60; color: white; }
        tr:nth-child(even) { background-color: #fbf0f3; }
        .status-btn { padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .pending { background-color: #ffc107; color: black; }
        .reviewed { background-color: #28a745; color: white; }
        .whatsapp-link { color: #128C7E; text-decoration: none; font-weight: bold; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="container">
    <h2>💍 بی بی فاطمہ شادی بیورو - موصول شدہ رشتے (ڈیش بورڈ)</h2>
    
    <table id="proposalsTable">
        <thead>
            <tr>
                <th>تاریخ / وقت</th>
                <th>نام</th>
                <th>جنس (Gender)</th>
                <th>عمر (Age)</th>
                <th>ذات (Caste)</th>
                <th>تعلیم / نوکری</th>
                <th>شہر (City)</th>
                <th>ڈیمانڈ (Requirements)</th>
                <th>رابطہ کریں</th>
                <th>اسٹیٹس</th>
            </tr>
        </thead>
        <tbody id="proposalsBody">
            <tr>
                <td colspan="10">رشتے لوڈ ہو رہے ہیں...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC8py3oEQFtzWIT_K0nIMK5oHoQYG6-zig",
  authDomain: "milk-order-48d48.firebaseapp.com",
  databaseURL: "https://milk-order-48d48-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "milk-order-48d48",
  storageBucket: "milk-order-48d48.firebasestorage.app",
  messagingSenderId: "171586337857",
  appId: "1:171586337857:web:4e16c73f163089460e9ac0",
  measurementId: "G-KEVF788FZ0"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

database.ref('proposals').on('value', (snapshot) => {
    const proposalsBody = document.getElementById('proposalsBody');
    proposalsBody.innerHTML = ''; 

    if (!snapshot.exists()) {
        proposalsBody.innerHTML = '<tr><td colspan="10">کوئی ریکارڈ موجود نہیں ہے۔</td></tr>';
        return;
    }

    const data = snapshot.val();
    const ids = Object.keys(data).reverse(); // نیا رشتہ سب سے اوپر آئے گا

    ids.forEach((id) => {
        const item = data[id];
        const statusClass = item.status === 'Pending' ? 'pending' : 'reviewed';
        const statusText = item.status === 'Pending' ? 'پینڈنگ' : 'دیکھ لیا (Checked)';

        const row = `
            <tr>
                <td>${item.registered_at || '---'}</td>
                <td><b>${item.name}</b></td>
                <td><span style="color:#d81b60; font-weight:bold;">${item.gender}</span></td>
                <td>${item.age} سال</td>
                <td>${item.caste}</td>
                <td>${item.education}</td>
                <td>${item.location}</td>
                <td style="max-width:200px; text-align:right;">${item.requirements}</td>
                <td><a class="whatsapp-link" href="https://wa.me/${item.phone.replace(/[^0-9]/g, '')}" target="_blank">💬 واٹس ایپ چیٹ</a></td>
                <td>
                    ${item.status === 'Pending' ? 
                    `<button onclick="markAsReviewed('${id}')" class="status-btn pending" style="border:none; cursor:pointer;">✓ ڈن کریں</button>` : 
                    `<span class="status-btn reviewed">✓ فائل محفوظ</span>`}
                </td>
            </tr>
        `;
        proposalsBody.innerHTML += row;
    });
});

function markAsReviewed(id) {
    if(confirm("کیا آپ اس رشتے کو 'دیکھ لیا/محفوظ' مارک کرنا چاہتے ہیں؟")) {
        database.ref('proposals/' + id).update({ status: "Reviewed" });
    }
}
</script>

</body>
</html>
