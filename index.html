<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibi Fatima Shadi Bureau - رشتہ رجسٹریشن فارم</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fce4ec; text-align: right; padding: 20px; direction: rtl; }
        .order-form { background-color: #ffffff; max-width: 500px; margin: 20px auto; padding: 30px; border-radius: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); border-top: 5px solid #d81b60; }
        h2 { text-align: center; color: #d81b60; margin-bottom: 5px; font-size: 24px; }
        h4 { text-align: center; color: #555; margin-top: 0; margin-bottom: 25px; font-weight: normal; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #333; font-size: 14px; }
        label span { color: #888; font-weight: normal; font-size: 13px; }
        input[type="text"], input[type="tel"], input[type="number"], select, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 15px; text-align: right; }
        .submit-btn { width: 100%; background-color: #25D366; color: white; padding: 14px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .submit-btn:hover { background-color: #128C7E; }
        .check-btn { width: 100%; background-color: #0288d1; color: white; padding: 14px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 12px; }
        .check-btn:hover { background-color: #01579b; }
        .success-box { display: none; background-color: #e8f5e9; border: 2px dashed #2e7d32; padding: 25px; border-radius: 12px; text-align: center; margin-top: 20px; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="order-form">
    <h2>بی بی فاطمہ شادی بیورو</h2>
    <h4>Bibi Fatima Shadi Bureau</h4>
    
    <div id="formFields">
        <div class="form-group"><label>پورا نام:</label><input type="text" id="name" required></div>
        <div class="form-group"><label>فون نمبر (واٹس ایپ):</label><input type="tel" id="phone" required></div>
        <div class="form-group">
            <label>رشتہ کس کے لیے مطلوب ہے؟</label>
            <select id="gender" required>
                <option value="">انتخاب کریں</option>
                <option value="Male (لڑکا)">لڑکا / Male</option>
                <option value="Female (لڑکی)">لڑکی / Female</option>
            </select>
        </div>
        <div class="form-group"><label>عمر:</label><input type="number" id="age" required></div>
        <div class="form-group"><label>ذات یا برادری:</label><input type="text" id="caste" required></div>
        <div class="form-group"><label>تعلیم اور ملازمت:</label><input type="text" id="education" required></div>
        <div class="form-group"><label>شہر یا موجودہ لوکیشن:</label><input type="text" id="location" required></div>
        <div class="form-group"><label>مطلوبہ رشتہ کی ڈیمانڈ:</label><textarea id="requirements" required></textarea></div>

        <button class="submit-btn" onclick="sendProposal()">رشتہ رجسٹرڈ کریں / Register Proposal</button>
        <button class="check-btn" onclick="window.location.href='view.html'">رشتے دیکھیں / See Proposals</button>
    </div>

    <div id="successBox" class="success-box">
        <h3 style="color: #2e7d32;">فارم جمع ہو گیا ہے! 🎉</h3>
        <p>آپ کا ڈیٹا ہمیں مل گیا ہے۔ رشتے دیکھنے کے لیے ایڈمن سے واٹس ایپ پر رجسٹریشن نمبر حاصل کریں اور نیچے بٹن پر کلک کریں۔</p>
        <button class="check-btn" onclick="window.location.href='view.html'">رجسٹریشن نمبر درج کریں</button>
    </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC8py3oEQFtzWIT_K0nIMK5oHoQYG6-zig",
  authDomain: "milk-order-48d48.firebaseapp.com",
  databaseURL: "https://milk-order-48d48-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "milk-order-48d48",
  storageBucket: "milk-order-48d48.firebasestorage.app",
  messagingSenderId: "171586337857",
  appId: "1:171586337857:web:4e16c73f163089460e9ac0"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

function sendProposal() {
    const whatsappNumber = "923076385077"; 
    
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const gender = document.getElementById('gender').value;
    const age = document.getElementById('age').value.trim();
    const caste = document.getElementById('caste').value.trim();
    const education = document.getElementById('education').value.trim();
    const location = document.getElementById('location').value.trim();
    const requirements = document.getElementById('requirements').value.trim();

    if(!name || !phone || !gender || !age || !caste || !education || !location || !requirements) {
        alert("⚠️ براہ کرم تمام معلومات درج کریں!");
        return;
    }

    // 🎲 ایک منفرد 5 ہندسوں کا رجسٹریشن نمبر بنانا
    const randomNum = Math.floor(10000 + Math.random() * 90000);
    const generatedRegNo = "FB-" + randomNum;

    const timestamp = new Date().toLocaleString("en-US", {timeZone: "Asia/Karachi"}); 
    
    database.ref('proposals').push({
        reg_no: generatedRegNo, // یہ خفیہ کوڈ ڈیٹا بیس میں جائے گا
        name: name,
        phone: phone,
        gender: gender,
        age: age,
        caste: caste,
        education: education,
        location: location,
        requirements: requirements,
        status: "Pending",
        registered_at: timestamp
    })
    .then(() => {
        // لوکل میموری میں جینڈر سیو کریں تاکہ فلٹر لگ سکے
        localStorage.setItem('userGender', gender);

        document.getElementById('formFields').style.display = 'none';
        document.getElementById('successBox').style.display = 'block';

        // 💬 واٹس ایپ میسج میں رجسٹریشن نمبر بھی شامل کر دیا گیا ہے تاکہ آپ کو پتا ہو
        let message = `*Bibi Fatima Shadi Bureau*\n*نیا رشتہ فارم جمع ہوا ہے*\n\n🔑 *رجسٹریشن نمبر:* ${generatedRegNo}\n\n*نام:* ${name}\n*رابطہ:* ${phone}\n*جنس:* ${gender}\n*عمر:* ${age}\n*ذات:* ${caste}\n*شہر:* ${location}`;
        window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`, '_blank');
    })
    .catch((error) => { alert("❌ مسئلہ آ گیا: " + error.message); });
}
</script>
</body>
</html>
