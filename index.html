<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خالص دودھ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            text-align: right;
            padding: 20px;
            direction: rtl;
        }
        .order-form {
            background-color: #ffffff;
            max-width: 450px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 5px solid #25D366;
        }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], input[type="tel"], input[type="number"] {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px;
        }
        button {
            width: 100%; background-color: #25D366; color: white; padding: 12px; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.3s;
        }
        button:hover { background-color: #128C7E; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="order-form">
    <h2>خالص دودھ کا آرڈر فارم</h2>
    
    <div class="form-group">
        <label for="name">نام:</label>
        <input type="text" id="name" placeholder="اپنا نام لکھیں" required>
    </div>

    <div class="form-group">
        <label for="phone">فون نمبر:</label>
        <input type="tel" id="phone" placeholder="اپنا واٹس ایپ نمبر لکھیں" required>
    </div>

    <div class="form-group">
        <label for="location">لوکیشن (پتہ):</label>
        <input type="text" id="location" placeholder="گھر کا پتہ یا لوکیشن لکھیں" required>
    </div>

    <div class="form-group">
        <label for="quantity">دودھ کتنے کلو؟</label>
        <input type="number" id="quantity" min="1" placeholder="مثال کے طور پر: 2" required>
    </div>

    <button onclick="sendOrder()">خالص دودھ کا آرڈر دیں</button>
</div>

<script>
// یہاں میں نے databaseURL شامل کر دی ہے جو غائب تھی
const firebaseConfig = {
  apiKey: "AIzaSyC8py3oEQFtzWIT_K0nIMK5oHoQYG6-zig",
  authDomain: "milk-order-48d48.firebaseapp.com",
  databaseURL: "https://milk-order-48d48-default-rtdb.firebaseio.com/", // 👈 یہ لائن لازمی تھی
  projectId: "milk-order-48d48",
  storageBucket: "milk-order-48d48.firebasestorage.app",
  messagingSenderId: "171586337857",
  appId: "1:171586337857:web:4e16c73f163089460e9ac0",
  measurementId: "G-KEVF788FZ0"
};

// فائر بیس کو ایکٹیو کریں
firebase.initializeApp(firebaseConfig);
const database = firebase.database();

function sendOrder() {
    const whatsappNumber = "923076385077"; 

    const name = document.getElementById('name').value;
    const phone = document.getElementById('phone').value;
    const location = document.getElementById('location').value;
    const quantity = document.getElementById('quantity').value;

    if(!name || !phone || !location || !quantity) {
        alert("براہ کرم تمام معلومات درج کریں!");
        return;
    }

    // ڈیٹا کو فائر بیس ڈیٹا بیس میں سیو کریں
    const orderTimestamp = new Date().toISOString(); 
    
    database.ref('orders/').push({
        customer_name: name,
        customer_phone: phone,
        customer_location: location,
        milk_quantity: quantity,
        status: "Pending",
        ordered_at: orderTimestamp
    })
    .then(() => {
        // فائر بیس میں کامیابی سے سیو ہونے کے بعد واٹس ایپ اوپن ہوگا
        const message = `*نیا آرڈر (خالص دودھ)*\n\n` +
                        `*نام:* ${name}\n` +
                        `*فون نمبر:* ${phone}\n` +
                        `*لوکیشن:* ${location}\n` +
                        `*مقدار:* ${quantity} کلو`;

        const encodedMessage = encodeURIComponent(message);
        const whatsappURL = `https://wa.me/${whatsappNumber}?text=${encodedMessage}`;
        
        window.open(whatsappURL, '_blank');
    })
    .catch((error) => {
        console.error("Firebase Error: ", error);
        alert("سسٹم میں خرابی کی وجہ سے آرڈر سیو نہیں ہو سکا، لیکن آپ واٹس ایپ پر بھیج سکتے ہیں۔");
    });
}
</script>

</body>
</html>
